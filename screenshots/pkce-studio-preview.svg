      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="accentGradPkce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkPkce)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0d1224" stroke="#1e294b" stroke-width="1.5"/>
  <rect x="46" y="38" width="32" height="32" rx="8" fill="url(#accentGradPkce)"/>
  <text x="62" y="59" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" text-anchor="middle">PK</text>
  
  <text x="90" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">PKCEFlowGuard Pro</text>
  <text x="280" y="55" fill="#06b6d4" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="330" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| RFC 7636 Proof Key for Code Exchange &amp; OAuth 2.1 Studio</text>

  <rect x="940" y="40" width="90" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="985" y="58" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 7636</text>

  <rect x="1040" y="40" width="115" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1097" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">OAUTH 2.1 READY</text>

  <!-- Left Column: Studio & Inputs -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0d1224" stroke="#1e294b" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. PKCE Cryptographic Studio</text>
  
  <rect x="470" y="113" width="95" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="517" y="129" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">METHOD: S256</text>

  <!-- Metrics row -->
  <rect x="50" y="150" width="155" height="60" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="127" y="180" fill="#22d3ee" font-family="monospace" font-weight="700" font-size="18" text-anchor="middle">128</text>
  <text x="127" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">LENGTH (43-128)</text>

  <rect x="230" y="150" width="155" height="60" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="307" y="180" fill="#34d399" font-family="monospace" font-weight="700" font-size="18" text-anchor="middle">669</text>
  <text x="307" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TOTAL ENTROPY BITS</text>

  <rect x="410" y="150" width="155" height="60" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="487" y="180" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Valid (66-ch)</text>
  <text x="487" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">RFC 7636 CHARSET</text>

  <!-- Verifier box -->
  <text x="50" y="240" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">code_verifier (Private Pre-image)</text>
  <rect x="50" y="250" width="515" height="70" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="60" y="275" fill="#f8fafc" font-family="monospace" font-size="11">m8K9_X-Z1p4Q7r2T5y8U3v6W9a2B4c6E8g0J2l4N6p8R0t2V4x6Z8-0b2d4f6h8j0l2n...</text>
  <text x="60" y="295" fill="#64748b" font-family="monospace" font-size="11">4p6r8t0v2x4z6-8a0c2e4g6i8k0m2o4q6s8u0w2y4.13579bdfhjlnprtvxzBDF</text>

  <!-- Challenge box -->
  <text x="50" y="345" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">code_challenge (Base64URL SHA-256)</text>
  <rect x="50" y="355" width="515" height="40" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="60" y="380" fill="#22d3ee" font-family="monospace" font-size="12">E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM</text>

  <!-- Authorization request preview -->
  <text x="50" y="425" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Synthesized Authorization URL (GET)</text>
  <rect x="50" y="435" width="515" height="60" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="60" y="458" fill="#38bdf8" font-family="monospace" font-size="10">https://identity.globalbank.com/oauth2/v2.0/authorize?</text>
  <text x="60" y="475" fill="#94a3b8" font-family="monospace" font-size="10">response_type=code&amp;client_id=bank_mobile_app_prod_9921&amp;code_challenge=E9Mel...&amp;method=S256</text>

  <!-- Token exchange preview -->
  <text x="50" y="525" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Token Exchange Request (POST /token)</text>
  <rect x="50" y="535" width="515" height="90" rx="8" fill="#080c1b" stroke="#1e294b"/>
  <text x="60" y="555" fill="#a78bfa" font-family="monospace" font-size="10">POST https://identity.globalbank.com/oauth2/v2.0/token</text>
  <text x="60" y="572" fill="#94a3b8" font-family="monospace" font-size="10">grant_type=authorization_code&amp;code=auth_code_xyz</text>
  <text x="60" y="589" fill="#34d399" font-family="monospace" font-size="10">&amp;code_verifier=m8K9_X-Z1p4Q7r2T5y8U3v6W9a2B4c6...</text>
  <text x="60" y="606" fill="#64748b" font-family="monospace" font-size="10">&amp;redirect_uri=https%3A%2F%2Fmobile.globalbank.com%2Fauth%2Fcallback</text>

  <!-- Right Column: Audit Scorecard & Threat Simulator -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0d1224" stroke="#1e294b" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="75" rx="10" fill="#091429" stroke="#1e294b"/>
  <rect x="650" y="132" width="60" height="50" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="680" y="167" fill="#34d399" font-family="monospace" font-weight="800" font-size="26" text-anchor="middle">A+</text>
  <text x="730" y="152" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">Score: 100 / 100</text>
  <text x="730" y="172" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">RFC 7636 &amp; OAuth 2.1 Fully Compliant • Production Ready</text>

  <!-- Checklist items -->
  <rect x="635" y="210" width="515" height="38" rx="6" fill="#080c1b" stroke="#1e294b"/>
  <text x="650" y="233" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Challenge Method Enforcement (15/15 pts) - S256 SHA-256 strictly enforced</text>

  <rect x="635" y="255" width="515" height="38" rx="6" fill="#080c1b" stroke="#1e294b"/>
  <text x="650" y="278" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Verifier Length Bounds (10/10 pts) - 128 characters within [43, 128]</text>

  <rect x="635" y="300" width="515" height="38" rx="6" fill="#080c1b" stroke="#1e294b"/>
  <text x="650" y="323" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Cryptographic Entropy (10/10 pts) - 669 bits total entropy</text>

  <rect x="635" y="345" width="515" height="38" rx="6" fill="#080c1b" stroke="#1e294b"/>
  <text x="650" y="368" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Base64URL Compliance (10/10 pts) - No padding '=', no standard '+', '/'</text>

  <!-- Threat Simulator Box -->
  <text x="635" y="415" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Authorization Code Interception Simulator</text>
  <rect x="635" y="430" width="515" height="195" rx="8" fill="#080c1b" stroke="#10b981" stroke-width="1.5"/>

  <rect x="645" y="440" width="495" height="30" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="655" y="460" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">SCENARIO B: ZERO-TRUST PKCE S256 SHIELD (HARDENED)</text>

  <text x="655" y="490" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">1. Legitimate App: Generates in-memory code_verifier + one-way code_challenge.</text>
  <text x="655" y="515" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11">2. IdP Redirects: Sends authorization_code via custom URI scheme.</text>
  <text x="655" y="540" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">3. Rogue App Intercepts: Rogue app steals auth code, but lacks secret verifier.</text>
  <text x="655" y="565" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">4. Attacker Fails: POST /token fails SHA-256 match -&gt; HTTP 400 invalid_grant.</text>
  <text x="655" y="590" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">5. Safe Exchange: Legitimate app submits verifier; tokens issued securely.</text>
  <text x="655" y="612" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">Zero user account compromise • Cryptographically guaranteed authentication barrier</text>
</svg>
